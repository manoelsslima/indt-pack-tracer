<section class="cadastro">
    <h1 class="titulo">Cadastro de Setor</h1>
    <form [formGroup]="formSetor" class="form-cadastro">
        <div class="form-group">
            <label for="id">Id:</label>
            <input id="id" formControlName="id" type="text" />
        </div>
        <div class="form-group">
            <label for="nome">Nome do Setor:</label>
            <input id="nome" formControlName="nome" type="text" />
        </div>
        <button (click)="salvar()" type="submit" class="botao-salvar">Salvar</button>
    </form>
</section>
