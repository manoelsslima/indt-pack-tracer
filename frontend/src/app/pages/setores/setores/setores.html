<h1>Lista de Setores</h1>

<button class="bg-yellow-200">Adicionar➕</button>

@for (setor of setores; track setor.SetorID) {
  <div>
    <p>Id: {{ setor.SetorID }}</p>
    <p>Nome: {{ setor.Nome }}</p>

    <button
      class="bg-red-200"
      (click)="removerSetor(setor.SetorID)">
      Excluir
    </button>

    <button
      class="bg-blue-200"
      (click)="alterarSetor(setor.SetorID)">
      Editar
    </button>

    <hr>
  </div>
}
