<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pack Tracer - Login</title>
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <section class="page-login">
        <div class="left">
            <img src="assets/images/login.jpg" class="login-logo-img" alt="Pack Tracer Logo" />
        </div>
        <div class="right">
            <h1>PACK TRACER</h1>
            <form class="login-form" [formGroup]="formLogin">
                <label for="usuario">Username:</label>
                <input type="text" formControlName="usuario" id="usuario" name="usuario" required />

                <label for="senha">Password:</label>
                <input type="password" formControlName="senha" id="senha" name="senha" required />

                <button type="submit" (click)="login()">
                    <mat-icon>login</mat-icon>
                    Login</button>
            </form>
        </div>
    </section>
</body>

</html>
